<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Calendarize</title></head>
<body>
<script>
/* This whole page is generated by renderPage(state) so that publishing a
   new state (via the `artifact` capability) always produces the exact
   same document a fresh visitor would get. Nothing here is duplicated
   elsewhere — this script IS the page's source. */

const INITIAL_STATE = { count: 0 };

function renderPage(state) {
  const count = Math.max(0, state.count | 0);
  const stateJSON = JSON.stringify(state).replace(/</g, '\\u003c');

  return `<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendarize</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500;1,9..144,600&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #EDEEE7;
    --paper-raised: #F7F7F2;
    --ink: #1C2430;
    --ink-soft: #5B6472;
    --accent: #D6472F;
    --accent-ink: #FFF7F2;
    --line: #D2D0C2;
    --line-strong: #B9B6A4;
    --shadow: rgba(28, 36, 48, 0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #14181F;
      --paper-raised: #1B2029;
      --ink: #ECE8DD;
      --ink-soft: #A6ABA0;
      --accent: #FF6A4D;
      --accent-ink: #1B0D08;
      --line: #2B303A;
      --line-strong: #3A404C;
      --shadow: rgba(0, 0, 0, 0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #14181F;
    --paper-raised: #1B2029;
    --ink: #ECE8DD;
    --ink-soft: #A6ABA0;
    --accent: #FF6A4D;
    --accent-ink: #1B0D08;
    --line: #2B303A;
    --line-strong: #3A404C;
    --shadow: rgba(0, 0, 0, 0.35);
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Work Sans", ui-sans-serif, system-ui, sans-serif;
    line-height: 1.55;
  }
  ::selection { background: var(--accent); color: var(--accent-ink); }
  a { color: inherit; }
  .display { font-family: "Fraunces", ui-serif, Georgia, serif; text-wrap: balance; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, monospace; }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 0 28px; }

  /* ---- header ---- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 28px 0;
  }
  .wordmark { font-size: 15px; letter-spacing: 0.02em; font-weight: 600; }
  .wordmark .dot { color: var(--accent); }
  .top-note { font-size: 13px; color: var(--ink-soft); }

  /* ---- hero ---- */
  .hero {
    display: grid;
    grid-template-columns: minmax(180px, 260px) 1fr;
    gap: 48px;
    align-items: center;
    padding: 48px 0 72px;
    border-bottom: 1px solid var(--line);
  }
  .date-card {
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: 0 18px 40px -22px var(--shadow);
    padding: 22px 22px 26px;
    position: relative;
    transform: rotate(-2deg);
  }
  .date-card .month {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 500;
  }
  .date-card .big-date {
    position: relative;
    font-size: 96px; line-height: 0.95; font-weight: 600; margin: 6px 0 4px;
  }
  .date-card .ring {
    position: absolute;
    top: -8px; left: -14px; right: -14px; bottom: 4px;
    border: 3px solid var(--accent);
    border-radius: 50% / 44%;
    transform: rotate(-4deg);
  }
  .date-card .caption {
    font-size: 13px; color: var(--ink-soft); border-top: 1px dashed var(--line-strong);
    padding-top: 10px; margin-top: 8px;
  }
  .hero h1 {
    margin: 0 0 18px;
    font-size: clamp(34px, 4.4vw, 54px);
    font-weight: 500; font-style: italic;
    letter-spacing: -0.01em;
  }
  .hero p.lede {
    margin: 0 0 30px; max-width: 46ch;
    font-size: 18px; color: var(--ink-soft);
  }

  form.capture { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  input[type="email"] {
    font: inherit; font-size: 16px;
    background: var(--paper-raised); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: 4px;
    padding: 13px 14px; width: 280px; max-width: 70vw;
  }
  input[type="email"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button {
    font: inherit; font-size: 15px; font-weight: 600;
    background: var(--accent); color: var(--accent-ink);
    border: none; border-radius: 4px; padding: 13px 20px; cursor: pointer;
  }
  button:hover { filter: brightness(1.06); }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .fineprint { font-size: 13px; color: var(--ink-soft); }
  .fineprint .count { color: var(--ink); font-weight: 600; }
  #confirm {
    display: none; font-size: 14px; margin-top: 10px;
    background: var(--paper-raised); border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 4px; max-width: 46ch;
  }
  #confirm.show { display: block; }

  /* ---- proof / how it works ---- */
  section { padding: 64px 0; border-bottom: 1px solid var(--line); }
  section:last-of-type { border-bottom: none; }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace; font-size: 12px;
    letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent);
    margin: 0 0 10px;
  }
  h2 { font-size: 26px; margin: 0 0 8px; font-weight: 600; }
  section > p.deck { color: var(--ink-soft); max-width: 60ch; margin: 0 0 36px; font-size: 16px; }

  .cells {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px;
  }
  .cell {
    border: 1px solid var(--line); border-radius: 4px; padding: 18px;
    background: var(--paper-raised);
  }
  .cell .num {
    font-family: "IBM Plex Mono", monospace; font-size: 13px; color: var(--ink-soft);
    border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 12px;
  }
  .cell h3 { font-size: 15px; margin: 0 0 6px; font-weight: 600; }
  .cell p { margin: 0; font-size: 14px; color: var(--ink-soft); }

  .why-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 22px; }
  .why-grid .item h3 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
  .why-grid .item p { margin: 0; font-size: 14.5px; color: var(--ink-soft); }
  .why-grid .item .mark { color: var(--accent); font-family: "Fraunces", serif; font-style: italic; font-size: 20px; }

  footer { padding: 40px 0 64px; }
  footer p { color: var(--ink-soft); font-size: 13px; margin: 0; }

  @media (max-width: 720px) {
    .hero { grid-template-columns: 1fr; gap: 32px; }
    .date-card { justify-self: start; width: 200px; }
    .cells, .why-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 480px) {
    .cells, .why-grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="wordmark">Calendar<span class="dot">i</span>ze</div>
      <div class="top-note">A month of drafts, in one sitting</div>
    </div>

    <div class="hero">
      <div class="date-card">
        <div class="month">Next Post Due</div>
        <div class="big-date"><span class="ring" aria-hidden="true"></span>—</div>
        <div class="caption">Nothing scheduled. That's the problem.</div>
      </div>
      <div>
        <h1 class="display">A month of on-topic drafts, done before you've finished your coffee.</h1>
        <p class="lede">Tell Calendarize your niche and posting cadence. Get back a dated calendar — each slot already carrying a real, edit-ready draft, not just a topic idea.</p>
        <form class="capture" id="signup-form">
          <input type="email" id="email-input" name="email" placeholder="you@email.com" required autocomplete="email">
          <button type="submit">Get early access</button>
        </form>
        <p class="fineprint">Opens your email app to confirm — <span class="count">${count}</span> ${count === 1 ? 'person has' : 'people have'} asked to be first in line.</p>
        <div id="confirm"></div>
      </div>
    </div>

    <section>
      <p class="eyebrow">The problem</p>
      <h2>Consistency beats quality alone</h2>
      <p class="deck">Most content efforts don't die from bad writing — they die from a missed week that turns into a missed month. A calendar that's already full removes the one decision that kills momentum: "what do I post today?"</p>
      <div class="why-grid">
        <div class="item"><div class="mark">01</div><h3>Real drafts, not lists</h3><p>Not "50 blog post ideas." Each calendar slot arrives with an actual draft — hook, concrete points, one next action — ready for your edit pass.</p></div>
        <div class="item"><div class="mark">02</div><h3>You stay in control</h3><p>Nothing publishes itself. You fact-check, add your voice, and hit publish on your own accounts, on your own schedule.</p></div>
        <div class="item"><div class="mark">03</div><h3>It learns from what worked</h3><p>Feed back what performed after each batch, and the next calendar gets sharper instead of guessing again from zero.</p></div>
      </div>
    </section>

    <section>
      <p class="eyebrow">How it works</p>
      <h2>Four steps, once a month</h2>
      <div class="cells">
        <div class="cell"><div class="num">01</div><h3>Set your niche</h3><p>Topic, audience, and the cadence you can actually sustain.</p></div>
        <div class="cell"><div class="num">02</div><h3>Get a calendar</h3><p>Dated slots, each holding a specific, searched-for topic — not a vague theme.</p></div>
        <div class="cell"><div class="num">03</div><h3>Get a draft per slot</h3><p>Hook, points, one clear action — ready for your read-through.</p></div>
        <div class="cell"><div class="num">04</div><h3>Publish and report back</h3><p>Say what landed. The next calendar starts from that signal.</p></div>
      </div>
    </section>

    <footer>
      <p>Calendarize is a demand-validation prototype — the counter above is real and live; the product behind it isn't built yet.</p>
    </footer>
  </div>

  <script id="calendarize-state" type="application/json">${stateJSON}<\/script>
  <script>
    (function () {
      const STATE = ${stateJSON};

      let artifactApi = null;
      let apiReady = (typeof claude !== 'undefined' && claude.use)
        ? claude.use('artifact').then(function (api) { artifactApi = api; return api; })
        : Promise.resolve(null);

      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('email-input');
      const confirmBox = document.getElementById('confirm');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        const subject = encodeURIComponent('Calendarize early access');
        const body = encodeURIComponent(
          'Please add me to the Calendarize early access list.\\n\\nMy email: ' + email
        );
        window.location.href = 'mailto:Calendarize@proton.me?subject=' + subject + '&body=' + body;

        confirmBox.textContent = "Your email app should be opening a pre-filled message — hit send there to confirm. (If nothing opened, email Calendarize@proton.me yourself.)";
        confirmBox.classList.add('show');
        form.querySelector('button').textContent = 'On the list';
        form.querySelector('button').disabled = true;

        apiReady.then(function (api) {
          if (!api) return;
          const newState = { count: STATE.count + 1 };
          return api.publish(RENDER_PAGE_SOURCE(newState)).catch(function () {
            /* not_writer / conflict / rate_limited: the counter is a bonus,
               the mailto above already carried the real signal */
          });
        });
      });
    })();

    function RENDER_PAGE_SOURCE(state) {
      return (${renderPage.toString()})(state);
    }
  <\/script>
</body>
</html>`;
}

document.open();
document.write(renderPage(INITIAL_STATE));
document.close();
</script>
</body>
</html>
