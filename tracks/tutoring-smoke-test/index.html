/* The whole page is generated by renderPage(state) so that publishing a
   new state (via the `artifact` capability) always reproduces exactly

      <div class="lesson-card">
        <p class="tag">Factoring Quadratics — Mistake 2 of 3</p>
        <h3 class="display">Sign errors when picking the factor pair</h3>
        <p>To factor <span class="mono">x² + bx + c</span>, you need two numbers that <strong>multiply to c</strong> and <strong>add to b</strong>. The most common error: finding a pair that multiplies correctly but getting the <em>signs</em> wrong.</p>
        <p>Example: factor <span class="mono">x² − 2x − 15</span>. You need product <span class="mono">−15</span>, sum <span class="mono">−2</span>. Since the product is negative, the two numbers must have <strong>opposite signs</strong> — lock that in before guessing.</p>
        <div class="eq">Correct pair: −5 and 3 → (−5)(3) = −15 ✓, and −5 + 3 = −2 ✓<br>x² − 2x − 15 = (x − 5)(x + 3)</div>
        <p class="checkline">Check by expanding: (x − 5)(x + 3) = x² + 3x − 5x − 15 = x² − 2x − 15 ✓</p>
        <div class="rule-box">Rule of thumb: if c is positive, both numbers share the sign of b. If c is negative, the numbers have opposite signs, and the larger one takes the sign of b.</div>

  <script>
    (function () {
      const STATE = ${stateJSON};

      let artifactApi = null;
      let apiReady = (typeof claude !== 'undefined' && claude.use)
        ? claude.use('artifact').then(function (api) { artifactApi = api; return api; })
        : Promise.resolve(null);

      const form = document.getElementById('signup-form');
      const emailInput = document.getElementById('email-input');
      const confirmBox = document.getElementById('confirm');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const email = emailInput.value.trim();
        if (!email) return;

        const subject = encodeURIComponent('Unstuck Math — interested');
        const body = encodeURIComponent(
          'Hi, I\\'d like to hear more about tutoring.\\n\\nMy email: ' + email +
          '\\n\\n(Optional: grade level and topic)'
        );
        window.location.href = 'mailto:Calendarize@proton.me?subject=' + subject + '&body=' + body;

        confirmBox.textContent = "Your email app should be opening a pre-filled message — hit send there to confirm. (If nothing opened, email Calendarize@proton.me yourself.)";
        confirmBox.classList.add('show');
        form.querySelector('button').textContent = 'Message started';
        form.querySelector('button').disabled = true;

        apiReady.then(function (api) {
          if (!api) return;
          const newState = { count: STATE.count + 1 };
          return api.publish(RENDER_PAGE_SOURCE(newState)).catch(function () {
            /* not_writer / conflict / rate_limited: the counter is a bonus,
               the mailto above already carried the real signal */
          });
        });
      });
    })();

    function RENDER_PAGE_SOURCE(state) {
      return (${renderPage.toString()})(state);
